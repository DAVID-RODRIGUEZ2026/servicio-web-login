# Nombre de la aplicacion
spring.application.name=serviciologin

# Puerto del servicio (8081 para no chocar con el parqueadero que usa 8080)
server.port=8081

# Conexion a la base de datos MySQL (XAMPP)
# createDatabaseIfNotExist=true crea la base de datos si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/serviciologin_db?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
# update: crea y actualiza las tablas segun las entidades sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL que se ejecutan
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true